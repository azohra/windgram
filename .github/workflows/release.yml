# Publishes the windgram package to npm when a version tag is pushed.
# Publishing stays a deliberate act — someone cuts the tag — but the
# mechanics are automated and every release carries npm provenance via
# GitHub OIDC (trusted publishing; no token secret lives in this repo).
#
# One-time setup on npmjs.com: package settings → Trusted publisher →
# GitHub Actions, repository azohra/windgram, workflow release.yml.
#
# Release flow: bump packages/windgram/package.json version on main,
# then `git tag v<version> && git push origin v<version>`. The guard
# below refuses to publish a tag that disagrees with package.json.
name: Release windgram

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing / provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable pnpm from the workspace pin
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Tag must match the package version
        run: |
          version=$(python3 -c "import json; print(json.load(open('packages/windgram/package.json'))['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version v${version}"
            exit 1
          fi
      - name: Test
        run: pnpm --dir packages/windgram test
      - name: Build
        run: pnpm --dir packages/windgram build
      - name: Update npm (trusted publishing needs >= 11.5)
        run: npm install -g npm@latest && npm --version
      - name: Publish with provenance
        working-directory: packages/windgram
        run: npm publish --provenance --access public
