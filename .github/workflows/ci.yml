name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Enable pnpm from the workspace pin
        run: corepack enable
      - name: Install locked dependencies
        run: |
          uv sync --frozen --project pipeline
          pnpm install --frozen-lockfile
      - name: Check generated scenario drift
        run: uv run --project pipeline windgram scenarios check
      # Committed doc figures (assets/*.svg) are regenerated from the
      # package renderer and compared byte-for-byte — the same contract that
      # keeps generated scenarios honest. The social-card raster is checked
      # for presence and dimensions only: its text is already path outlines,
      # but PNG bytes still vary across chromium builds and platforms.
      - name: Check generated doc-figure drift
        run: pnpm --dir scripts figures:check
      - name: Test Python pipeline
        env:
          PYTHONFAULTHANDLER: "1"
        run: uv run --project pipeline pytest pipeline/tests
      - name: Test TypeScript package and scenario SVG goldens
        run: pnpm --dir toolkit test
      - name: Type-check TypeScript package
        run: pnpm --dir toolkit typecheck
      # Every ts fence in the portal MDX and the README files is extracted
      # and compiled against the built package's type declarations — a doc
      # example that no longer compiles is a red build. Deliberately partial fences
      # opt out with a `windgram-doc-fence: ignore` comment; see the header
      # of scripts/check-doc-fences.mjs. The script builds the package first.
      - name: Typecheck documentation code fences
        run: pnpm --dir scripts doc-fences:check
      - name: Check site
        run: pnpm --dir site check
      - name: Build site without live forecast data
        run: pnpm --dir site build
      - name: Install browser for static site QA
        run: pnpm --dir site exec playwright install --with-deps chromium
      # Two site checks: every content-source article exists in the build,
      # and the rendered windgram uses the package's own defaults. Chart
      # pixels are fenced where they are deterministic: the golden SVGs.
      - name: Test built site routes and windgram presentation
        run: pnpm --dir site test:built
