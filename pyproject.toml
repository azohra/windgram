[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "windgram"
version = "2.0.0"
description = "Open pipeline for publishing model-derived soaring profiles as static JSON."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "eccodes>=2.47.0",
    "eccodeslib>=2.48.0.26",
    "jsonschema>=4.25",
    "requests>=2.32",
]

[project.scripts]
windgram = "windgram.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["windgram"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
