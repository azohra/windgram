[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "windgram"
version = "0.6.2"
description = "Open pipeline for publishing model-derived soaring profiles as static JSON."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "eccodes>=2.47.0",
    "eccodeslib>=2.48.0.26",
    "h5py>=3.11",
    "jsonschema>=4.25",
    "numpy>=1.26",
    "requests>=2.32",
]

# The one-shot `windgram terrain` catalogue enrichment streams COG windows
# through rasterio; the cron builds never need it, so it stays out of the
# default dependency set.
[project.optional-dependencies]
terrain = [
    "numpy>=1.26",
    "rasterio>=1.4",
]

[project.urls]
Homepage = "https://windgram.azohra.com"
Repository = "https://github.com/azohra/windgram"
Documentation = "https://windgram.azohra.com/docs/"

[project.scripts]
windgram = "windgram.cli:main"

[dependency-groups]
# netcdf4 is TEST-ONLY, and only ever imported in a subprocess
# (tests/builders/netcdf4_reference.py): its bundled libhdf5 beside
# h5py's segfaults a shared interpreter at shutdown.
dev = ["netcdf4>=1.7", "pytest>=8"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["windgram", "windgram.builders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
