<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 718 78" role="img" aria-label="Windgram key: line styles for Usable lift, Cloud base, Boundary layer, Model boundary layer, 0 °C, Condensation and the lapse-rate stability ramp." class="wg wg-key">
<style>
.wg text { font-family: var(--wg-font, "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif); }
